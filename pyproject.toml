[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-daily"
version = "0.1.0"
description = "نظام يجمع محتوى عن الذكاء الاصطناعي من مصادر مختلفة، يعالجه، ويجهزه للنشر في قناة واتساب AI Daily."
requires-python = ">=3.10"
readme = "README.md"

dependencies = [
    "feedparser>=6.0.0",
    "python-dotenv>=1.0.0",
    "anthropic>=0.40.0",
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
ai-daily = "ai_daily.main:main"

[tool.setuptools.packages.find]
where = ["src"]
